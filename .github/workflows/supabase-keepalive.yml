name: Supabase Keepalive

# Free-tier Supabase projects auto-pause after ~7 days of *database* inactivity.
# A plain auth ping (/auth/v1/settings) never touches Postgres, so the project
# paused despite the keepalive. Instead we hit the app's /api/health endpoint,
# which runs a real 1-row SELECT through the DAL — genuine DB activity that
# resets the auto-pause timer.

on:
  schedule:
    # Daily at 06:17 UTC (off-peak, avoids the busy top of the hour).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping app health endpoint (real DB query)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      HEALTH_URL: ${{ vars.HEALTH_URL || 'https://ministranten-wett.vercel.app/api/health' }}
    steps:
      - name: Ping /api/health (real SELECT via the DAL)
        run: |
          set -euo pipefail
          status=$(curl -sS --retry 2 --retry-delay 5 -o /tmp/body -w "%{http_code}" \
            -H "Accept: application/json" \
            "${HEALTH_URL}")
          echo "HTTP ${status}"
          head -c 200 /tmp/body
          echo
          if [ "${status}" != "200" ]; then
            echo "::error::Supabase keepalive ping failed (HTTP ${status})"
            exit 1
          fi
