name: Supabase Keepalive

# Daily readiness monitoring of Vercel, the database and Supabase Auth.
# /api/health runs a real SELECT. Monitoring detects failures; it does not
# guarantee that a free-tier provider will never pause or suspend a project.
# Configure repository Actions failure notifications for the operator account.

on:
  schedule:
    # Daily at 06:17 UTC (off-peak, avoids the busy top of the hour).
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Check website, database and authentication
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      APP_BASE_URL: ${{ vars.APP_BASE_URL }}
      HEALTH_URL: ${{ vars.HEALTH_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Check application readiness
        run: node scripts/ops/check-health.mjs
